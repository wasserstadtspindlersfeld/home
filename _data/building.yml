# Text for the 3D building map on the Maps page.
# The shapes of the wings live in _src/building-3d/geometry.js.

# Door numbers are wing.floor.door. de = the German short name people see on doorbells and letters,
# de_long = the same written out, for the German pages.
floors:
  - { n: 0, en: "Ground floor", de: "EG", de_long: "Erdgeschoss" }
  - { n: 1, en: "1st floor", de: "1. OG", de_long: "1. Obergeschoss" }
  - { n: 2, en: "2nd floor", de: "2. OG", de_long: "2. Obergeschoss" }
  - { n: 3, en: "3rd floor", de: "3. OG", de_long: "3. Obergeschoss" }
  - { n: 4, en: "4th floor", de: "4. OG", de_long: "4. Obergeschoss" }

# Wing colours follow the printed maps. Each is named after a dye the W. Spindler
# works could have used. ink = text colour that stays readable on the swatch. de = German names.
wings:
  - { n: 1, color: "#E8892B", ink: "#1d2523", dye: "Saffron", where: "Northwest corner, along Adolf-Heyden-Straße", de: { dye: "Safran", where: "Nordwestecke, an der Adolf-Heyden-Straße" } }
  - { n: 2, color: "#C8463D", ink: "#ffffff", dye: "Madder red", where: "North side, along Carl-Spindler-Straße", de: { dye: "Krapprot", where: "Nordseite, an der Carl-Spindler-Straße" } }
  - { n: 3, color: "#8E4FA0", ink: "#ffffff", dye: "Orchil purple", where: "North side, middle and east, along Carl-Spindler-Straße", de: { dye: "Orseille-Purpur", where: "Nordseite, Mitte und Osten, an der Carl-Spindler-Straße" } }
  - { n: 4, color: "#4F82C0", ink: "#ffffff", dye: "Woad blue", where: "Northeast corner, facing the Spree", de: { dye: "Waidblau", where: "Nordostecke, zur Spree hin" } }
  - { n: 5, color: "#E2BE34", ink: "#1d2523", dye: "Weld yellow", where: "Inside the courtyard, joined to the north side", de: { dye: "Waugelb", where: "Im Innenhof, mit der Nordseite verbunden" } }
  - { n: 6, color: "#2E9A84", ink: "#ffffff", dye: "Malachite green", where: "East side, facing the Spree", de: { dye: "Malachitgrün", where: "Ostseite, zur Spree hin" } }
  - { n: 7, color: "#8A5A3E", ink: "#ffffff", dye: "Cutch brown", where: "South side, east half, along Henriette-Lustig-Straße", de: { dye: "Katechubraun", where: "Südseite, östliche Hälfte, an der Henriette-Lustig-Straße" } }
  - { n: 8, color: "#D2378F", ink: "#ffffff", dye: "Fuchsine", where: "South side, west half, along Henriette-Lustig-Straße", de: { dye: "Fuchsin", where: "Südseite, westliche Hälfte, an der Henriette-Lustig-Straße" } }
  - { n: 9, color: "#26457D", ink: "#ffffff", dye: "Prussian blue", where: "Southwest corner, along Adolf-Heyden-Straße", de: { dye: "Berliner Blau", where: "Südwestecke, an der Adolf-Heyden-Straße" } }

# Street entrances marked on the printable map. wings = the wings whose flats go in by it.
# doors = single flats that go in by it instead of by their wing's entrance, on every floor
# ({ wing: 9, door: 11 } is 9.0.11, 9.1.11, 9.2.11 ...). note = shown after the address on the 3D map.
entrances:
  - { id: cs13, label: "Carl-Spindler-Str. 13", wings: [4] }
  - { id: cs15, label: "Carl-Spindler-Str. 15", wings: [3] }
  - { id: ah1, label: "Adolf-Heyden-Str. 1", wings: [1] }
  - { id: ah3, label: "Adolf-Heyden-Str. 3", note: "garage", wings: [], doors: [{ wing: 9, door: 11 }], de: { note: "Tiefgarage" } }
  - { id: ah5, label: "Adolf-Heyden-Str. 5", wings: [9] }
  - { id: hl14, label: "Henriette-Lustig-Str. 14", wings: [7, 8] }

# Shared laundry rooms, each by the street entrance you go in by (an id from the list above).
# They show on the 3D map as blue pins next to that entrance. vending = the vending machines.
laundry:
  - { entrance: ah1, washers: 5, dryers: 3, vending: [] }
  - { entrance: ah5, washers: 3, dryers: 2, vending: ["Coffee and tea", "Snacks"], de: { vending: ["Kaffee und Tee", "Snacks"] } }
