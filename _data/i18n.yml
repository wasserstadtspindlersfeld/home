# The words around the content (menu, buttons, labels) in each language.
# German pages live under de/ and get lang: de from _config.yml. Section names are in sections.yml,
# and the 3D map's wing and floor names in building.yml.

en:
  name: English
  locale: en_GB
  description: Useful information for the residents of Wasserstadt Spindlersfeld in Berlin-Köpenick.
  skip: Skip to content
  home_label: Wasserstadt Spindlersfeld, home page
  menu: Menu
  close: Close
  sections: Sections
  nav_foot: Collected by residents, for residents
  appearance: Appearance
  system: System
  light: Light
  dark: Dark
  language: Language
  switch_to: Deutsch
  on_this_page: On this page
  footer_history: >-
    The Ringbau is the former main building of the W.&nbsp;Spindler laundry and dye works, which opened here
    on the Spree in 1873. <a href="https://de.wikipedia.org/wiki/W._Spindler">Who was Wilhelm Spindler?</a>
  footer_contribute: >-
    Collected by residents, for residents. Ideas and fixes are welcome by
    <a href="mailto:spindlersfeldwasserstadt@gmail.com">email</a> or on
    <a href="https://github.com/wasserstadtspindlersfeld/home">GitHub</a>.
  # home page
  district: On the Spree
  hero_alt: The Ringbau from above in autumn, with the Spree behind it
  hero_alt_winter: The Ringbau from above, dressed up for Christmas
  hero_chip: The old Spindler dye works
  find_door: Find<br>a door
  wing: Wing
  floor: Floor
  door: Door
  show_on_map: Show on the map
  door_help: Door numbers are <b>wing.floor.door</b>, so 1.2.3 is wing 1, 2nd floor, door 3.
  guide: The guide
  n_sections: sections
  map_badge: 3D model
  map_alt: The 3D model of the building
  # 3D map
  b3d_title: The building in 3D
  b3d_lead: Tap a wing, or type a door number to see its wing and floor. You can send the link to visitors.
  b3d_canvas: 3D model of the building and its nine wings. The wing buttons below the model do the same as tapping it.
  b3d_night: Night view
  b3d_zoom_in: Zoom in
  b3d_zoom_out: Zoom out
  b3d_reset: Show the whole building
  b3d_hint_touch: Drag to turn · pinch to zoom
  b3d_hint_mouse: Drag to turn · hold Ctrl and scroll to zoom
  b3d_hint_wheel: Hold Ctrl (or ⌘) and scroll to zoom
  b3d_floors: Floor
  b3d_pick_floor: Choose a floor
  b3d_loading: Loading the building…
  b3d_fallback: Your browser can’t show the 3D view. The wing buttons still work, and the flat map is further down this page.
  b3d_empty: Tap a wing on the model, pick one of the coloured wing buttons, or type a door number.
  b3d_find: Find a door
  b3d_show: Show
  b3d_help: "Door numbers are <b>wing.floor.door</b>: 1.2.3 is wing 1, 2nd floor, door 3."
  b3d_wings: Wings
  b3d_legend: Wing colours match the printed maps. Each one is named after a dye, a nod to the old Spindler dye works.
  b3d_laundry: Laundry rooms
  b3d_washers: washers
  b3d_dryers: dryers
  b3d_noscript: The 3D map needs JavaScript. The flat map is further down this page.

