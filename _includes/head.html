<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% if page.layout == "home" %}{{ site.title }}{% else %}{{ page.title }} · {{ site.title }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<meta name="theme-color" content="#f5f0e8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14110e" media="(prefers-color-scheme: dark)">
<script>
  // Before the first paint: note that scripts run, and apply a saved light or dark choice
  (function () {
    var d = document.documentElement, t = null;
    d.classList.add('js');
    try { t = localStorage.getItem('theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') t = null;
    d.setAttribute('data-theme-pref', t || 'system');
    if (!t) return;
    d.setAttribute('data-theme', t);
    var m = document.querySelectorAll('meta[name="theme-color"]');
    for (var i = 0; i < m.length; i++) m[i].setAttribute('content', t === 'dark' ? '#14110e' : '#f5f0e8');
  })();
</script>
<meta property="og:title" content="{% if page.layout == 'home' %}{{ site.title }}{% else %}{{ page.title }} · {{ site.title }}{% endif %}">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta property="og:image" content="{{ '/assets/img/og-image.jpg' | absolute_url }}">
<link rel="manifest" href="{{ '/resources/manifest.json' | relative_url }}">
<link rel="icon" href="{{ '/assets/img/icons/icon-32.png' | relative_url }}" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="{{ '/assets/img/icons/icon-180.png' | relative_url }}">
<link rel="preload" href="{{ '/assets/fonts/d-din-pro-400.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{ '/assets/fonts/d-din-pro-800.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}?v={{ site.time | date: '%s' }}">
<script defer src="{{ '/assets/js/site.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
