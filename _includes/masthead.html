<header class="masthead">
 <div class="masthead-inner">
  <div class="masthead-bar">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="Wasserstadt Spindlersfeld, home page">
      {% include logo.html class="brand-mark" %}
      <span class="brand-text">
        <span class="brand-eyebrow">Residents' guide</span>
        <span class="brand-name">Wasserstadt Spindlersfeld</span>
      </span>
    </a>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
      {% include icon.html name="menu" %}{% include icon.html name="close" %}<span>Menu</span>
    </button>
  </div>
  <nav id="site-nav" class="site-nav" aria-label="Sections" data-open="false">
    <ul>
      {%- for s in site.data.sections %}
      <li><a href="{{ s.url | relative_url }}"{% if page.url == s.url %} aria-current="page"{% endif %}>{% include icon.html name=s.icon %}<span>{{ s.title }}</span></a></li>
      {%- endfor %}
    </ul>
  </nav>
 </div>
</header>
