<header class="page-head">
  {%- assign kicker = page.kicker | default: include.section.kicker -%}
  {%- assign icon = page.icon | default: include.section.icon -%}
  {%- if kicker %}
  <p class="kicker">{% if icon %}<span class="plate plate-s">{% include icon.html name=icon weight=2 %}</span>{% endif %}<span>{{ kicker }}</span></p>
  {%- endif %}
  <h1 class="page-title">{{ page.title }}</h1>
</header>
