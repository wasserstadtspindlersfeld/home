---
layout: default
---
{%- include find-section.html -%}
<main id="main" class="page" style="--dye: {{ section.dye | default: '#B4492F' }}; --dye-ink: {{ section.dye_ink | default: '#ffffff' }}">
  {% include page-head.html %}
  {%- if page.toc %}
  <nav class="toc panel" data-toc hidden aria-label="On this page"><p class="toc-label">On this page</p></nav>
  {%- endif %}
  <article class="prose"{% if page.accordion %} data-accordion{% endif %}{% if page.places %} data-places{% endif %}>
{{ content }}
  </article>
</main>
